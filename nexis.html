<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .logo-font { font-family: 'Space Grotesk', sans-serif; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); }
    .chat-bg { background: linear-gradient(180deg, #0a0a0f 0%, #12121a 100%); }
    .server-icon { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .server-icon:hover { border-radius: 40% !important; transform: scale(1.08); }
    .server-icon-active { border-radius: 40% !important; box-shadow: 0 0 0 4px rgb(139 92 246 / 0.6); }
    .message-hover:hover { background: rgba(139, 92, 246, 0.08); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgb(139 92 246); border-radius: 20px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex flex-col overflow-hidden">

  <!-- Top Bar -->
  <div class="h-12 bg-zinc-900 border-b border-zinc-800 flex items-center px-4 z-50">
    <div onclick="navigateToHome()" class="logo-font text-3xl font-bold tracking-tighter text-white flex items-center cursor-pointer">
      <span class="text-violet-400">N</span>exis
    </div>
    <div class="flex-1 max-w-md mx-8">
      <div onclick="showSearchModal()" class="bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded-3xl px-5 py-2 text-sm flex items-center gap-x-3 cursor-pointer">
        <i class="fa-solid fa-magnifying-glass text-zinc-400"></i>
        <span class="text-zinc-400">Search • Ctrl K</span>
      </div>
    </div>
    <div class="flex items-center gap-x-6">
      <button onclick="startVoiceCall()" class="text-emerald-400 hover:text-emerald-300"><i class="fa-solid fa-phone"></i></button>
      <button onclick="startVideoCall()" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-video"></i></button>
      <div onclick="showProfileModal()" class="flex items-center gap-x-3 cursor-pointer">
        <img id="top-avatar" src="https://picsum.photos/id/64/32/32" class="w-8 h-8 rounded-2xl">
        <span id="top-username" class="text-sm font-medium"></span>
      </div>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden">
    <!-- Servers -->
    <div class="w-20 bg-zinc-950 border-r border-zinc-800 flex flex-col items-center py-4 gap-y-3 overflow-y-auto custom-scroll">
      <div onclick="switchToHomeView()" class="w-14 h-14 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-3xl flex items-center justify-center text-3xl cursor-pointer mb-4 server-icon">🪐</div>
      <div id="servers-list" class="flex flex-col gap-y-3"></div>
      <div onclick="createNewServer()" class="w-14 h-14 bg-zinc-800 hover:bg-emerald-500 rounded-3xl flex items-center justify-center text-4xl cursor-pointer text-emerald-400 server-icon">
        <i class="fa-solid fa-plus"></i>
      </div>
    </div>

    <!-- Channels -->
    <div class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col">
      <div id="server-header" class="h-14 border-b border-zinc-700 px-4 flex items-center justify-between hover:bg-zinc-800 cursor-pointer hidden">
        <div class="flex items-center gap-x-3">
          <div id="server-icon" class="text-3xl"></div>
          <div id="server-name" class="font-semibold"></div>
        </div>
      </div>
      <div id="channels-list" class="flex-1 overflow-y-auto custom-scroll px-3 py-4"></div>
    </div>

    <!-- Main Chat -->
    <div class="flex-1 flex flex-col">
      <div id="chat-header" class="h-14 border-b border-zinc-700 px-6 flex items-center bg-zinc-900 hidden">
        <div class="flex-1 flex items-center gap-x-4">
          <span id="channel-symbol" class="text-2xl text-zinc-400">#</span>
          <div>
            <div id="channel-name-header" class="font-semibold"></div>
            <div id="channel-desc-header" class="text-xs text-zinc-400"></div>
          </div>
        </div>
        <i onclick="toggleMembersSidebar()" class="fa-solid fa-users cursor-pointer hover:text-white text-xl"></i>
      </div>

      <div id="messages" class="flex-1 overflow-y-auto custom-scroll p-6 chat-bg space-y-6"></div>

      <div id="chat-input-container" class="p-4 border-t border-zinc-700 bg-zinc-900 hidden">
        <div class="flex gap-x-2 glass border border-zinc-700 rounded-3xl p-2">
          <button onclick="triggerFileUpload()" class="px-4 py-3 text-violet-400"><i class="fa-solid fa-paperclip"></i></button>
          <textarea id="chat-input" rows="1" class="flex-1 bg-transparent px-5 py-3 outline-none max-h-52" placeholder="Message..." onkeydown="handleKeydown(event)"></textarea>
          <button onclick="showEmojiModal()" class="px-4 py-3 text-violet-400"><i class="fa-solid fa-face-smile"></i></button>
          <button onclick="sendMessage()" class="bg-violet-600 px-6 py-3 rounded-2xl"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <!-- Members -->
    <div id="members-sidebar" class="w-72 bg-zinc-900 border-l border-zinc-700 hidden lg:flex flex-col">
      <div class="p-4 border-b border-zinc-700 text-xs font-medium text-zinc-400">MEMBERS</div>
      <div id="members-list" class="flex-1 overflow-y-auto custom-scroll p-3"></div>
    </div>
  </div>

  <!-- Call Modal -->
  <div id="call-modal" class="hidden fixed inset-0 bg-black/90 z-[9999] flex items-center justify-center">
    <div class="glass max-w-md w-full rounded-3xl p-8 text-center">
      <div id="call-status" class="text-2xl mb-8"></div>
      <div class="flex justify-center gap-8 text-6xl mb-8">
        <button onclick="toggleMute()" class="text-emerald-400"><i class="fa-solid fa-microphone"></i></button>
        <button onclick="endCall()" class="text-red-500"><i class="fa-solid fa-phone-slash"></i></button>
      </div>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="hidden fixed inset-0 bg-black/90 z-[9999] flex items-center justify-center">
    <div class="glass max-w-md w-full rounded-3xl p-10 text-center">
      <div class="logo-font text-6xl mb-10">Nexis</div>
      <button onclick="googleSignIn()" class="w-full py-5 bg-white text-black rounded-2xl font-medium mb-4 flex items-center justify-center gap-3">
        <i class="fa-brands fa-google"></i> Continue with Google
      </button>
      <button onclick="guestSignIn()" class="w-full py-5 border border-zinc-600 hover:bg-zinc-800 rounded-2xl">Continue as Guest</button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-8 left-1/2 -translate-x-1/2 bg-zinc-900 border border-violet-400 px-8 py-4 rounded-3xl z-[99999]"></div>

  <script>
    // === FIREBASE CONFIG ===
    const firebaseConfig = {
      apiKey: "AIzaSyB6d6KXpzXBS702PwR2TYdA2vWiYRP-OJ0",
      authDomain: "hyperspacechat.firebaseapp.com",
      databaseURL: "https://hyperspacechat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "hyperspacechat",
      storageBucket: "hyperspacechat.firebasestorage.app",
      messagingSenderId: "620090648601",
      appId: "1:620090648601:web:06826975596fceb32aa288"
    };

    let app, auth, db, storage;
    let currentUser = null;
    let currentServer = null;
    let currentChannel = null;
    let messageListener = null;
    let localStream = null;
    let peerConnection = null;

    function initFirebase() {
      if (app) return;
      app = firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.database();
      storage = firebase.storage();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3000);
    }

    async function googleSignIn() {
      initFirebase();
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;
        initializeApp();
      } catch (e) { showToast("Google sign-in failed"); }
    }

    function guestSignIn() {
      const username = prompt("Choose username:", "cosmic_explorer");
      if (!username) return;
      initFirebase();
      auth.signInAnonymously().then(() => {
        currentUser = { uid: auth.currentUser.uid, displayName: username, photoURL: `https://picsum.photos/id/${Math.floor(Math.random()*300)}/128/128` };
        initializeApp();
      });
    }

    function initializeApp() {
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('top-username').textContent = currentUser.displayName;
      document.getElementById('top-avatar').src = currentUser.photoURL;

      loadDemoServers();
      renderServers();
      if (userServers.length > 0) selectServer(userServers[0]);
    }

    let userServers = [];
    function loadDemoServers() {
      userServers = [{
        id: "global-nexus",
        name: "The Nexus",
        icon: "🌌",
        channels: [
          {id: "general", name: "general", topic: "Welcome to Nexis"},
          {id: "off-topic", name: "off-topic", topic: "Anything goes"}
        ]
      }];
    }

    function renderServers() {
      const container = document.getElementById('servers-list');
      container.innerHTML = '';
      userServers.forEach(s => {
        const div = document.createElement('div');
        div.className = `w-14 h-14 flex items-center justify-center text-4xl cursor-pointer server-icon bg-zinc-800 ${currentServer?.id === s.id ? 'server-icon-active' : ''}`;
        div.textContent = s.icon;
        div.onclick = () => selectServer(s);
        container.appendChild(div);
      });
    }

    function selectServer(server) {
      currentServer = server;
      renderServers();
      document.getElementById('server-header').classList.remove('hidden');
      document.getElementById('server-icon').textContent = server.icon;
      document.getElementById('server-name').textContent = server.name;
      renderChannels();
    }

    function renderChannels() {
      const container = document.getElementById('channels-list');
      container.innerHTML = '';
      currentServer.channels.forEach(ch => {
        const div = document.createElement('div');
        div.className = `px-4 py-3 rounded-2xl cursor-pointer flex items-center gap-3 ${currentChannel?.id === ch.id ? 'bg-violet-600 text-white' : 'hover:bg-zinc-800'}`;
        div.innerHTML = `<span class="text-xl">#</span><span>${ch.name}</span>`;
        div.onclick = () => selectChannel(ch);
        container.appendChild(div);
      });
    }

    function selectChannel(channel) {
      if (messageListener) messageListener.off();
      currentChannel = channel;
      renderChannels();
      document.getElementById('chat-header').classList.remove('hidden');
      document.getElementById('chat-input-container').classList.remove('hidden');
      document.getElementById('channel-name-header').textContent = channel.name;
      document.getElementById('channel-desc-header').textContent = channel.topic || "";
      loadMessages();
    }

    function loadMessages() {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '<div class="text-center text-zinc-400 py-10">Loading messages...</div>';

      const path = `messages/${currentServer.id}/${currentChannel.id}`;
      messageListener = db.ref(path).orderByChild('timestamp').limitToLast(100);

      messageListener.on('value', snapshot => {
        messagesDiv.innerHTML = '';
        const msgs = snapshot.val() || {};
        if (Object.keys(msgs).length === 0) {
          messagesDiv.innerHTML = `<div class="text-center py-20 text-zinc-400">This is the beginning of #${currentChannel.name}</div>`;
          return;
        }
        Object.values(msgs).forEach(msg => renderSingleMessage(msg));
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });
    }

    function renderSingleMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = "flex gap-4 message-hover p-3 rounded-2xl group";
      let contentHTML = `<div class="text-zinc-100">${msg.content}</div>`;

      if (msg.fileUrl) {
        if (msg.fileType && msg.fileType.startsWith('image')) {
          contentHTML = `<a href="${msg.fileUrl}" target="_blank" class="text-violet-400 underline">📸 Image: ${msg.fileName}</a>`;
        } else {
          contentHTML = `<a href="${msg.fileUrl}" target="_blank" class="text-violet-400 underline">📎 ${msg.fileName}</a>`;
        }
      }

      div.innerHTML = `
        <img src="${msg.avatar || 'https://picsum.photos/id/64/40/40'}" class="w-10 h-10 rounded-2xl">
        <div class="flex-1">
          <div class="flex items-baseline gap-3">
            <span class="font-semibold">${msg.sender}</span>
            <span class="text-xs text-zinc-500">${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          ${contentHTML}
        </div>
      `;
      container.appendChild(div);
    }

    async function sendMessage() {
      if (!currentUser || !currentChannel) return;
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content) return;

      const path = `messages/${currentServer.id}/${currentChannel.id}`;
      const newMsgRef = db.ref(path).push();
      await newMsgRef.set({
        sender: currentUser.displayName,
        avatar: currentUser.photoURL,
        content: content,
        timestamp: Date.now(),
        uid: currentUser.uid
      });
      input.value = '';
    }

    async function triggerFileUpload() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*,video/*';
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        showToast("Uploading file...");

        const storageRef = storage.ref(`uploads/${currentServer.id}/${currentChannel.id}/${Date.now()}-${file.name}`);
        await storageRef.put(file);
        const url = await storageRef.getDownloadURL();

        const path = `messages/${currentServer.id}/${currentChannel.id}`;
        const newMsgRef = db.ref(path).push();
        await newMsgRef.set({
          sender: currentUser.displayName,
          avatar: currentUser.photoURL,
          content: "",
          fileUrl: url,
          fileName: file.name,
          fileType: file.type,
          timestamp: Date.now(),
          uid: currentUser.uid
        });
        showToast("File sent as link");
      };
      input.click();
    }

    function handleKeydown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    // === WebRTC (Basic) ===
    async function startCall(isVideo) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('call-modal').classList.remove('hidden');
        document.getElementById('call-status').textContent = isVideo ? "Video Call" : "Voice Call";

        peerConnection = new RTCPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        // In real app you need signaling (Firebase DB works for that)
        showToast("Call started (demo - signaling not fully implemented)");
      } catch (err) {
        showToast("Camera/Microphone access denied");
      }
    }

    function startVoiceCall() { startCall(false); }
    function startVideoCall() { startCall(true); }

    function toggleMute() {
      if (localStream) localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled;
    }

    function endCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) peerConnection.close();
      document.getElementById('call-modal').classList.add('hidden');
      showToast("Call ended");
    }

    // Other functions (shortened)
    function createNewServer() { showToast("Server creation coming soon"); }
    function toggleMembersSidebar() { document.getElementById('members-sidebar').classList.toggle('hidden'); }
    function showProfileModal() { 
      document.getElementById('profile-modal').classList.remove('hidden'); 
    }
    function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }
    function logout() { auth.signOut().then(() => location.reload()); }
    function navigateToHome() { showToast("Welcome to Nexis"); }
    function switchToHomeView() { showToast("Home feed coming soon"); }
    function showSearchModal() { const q = prompt("Search:"); if(q) showToast(`Results for "${q}"`); }
    function showEmojiModal() { showToast("Emoji picker coming soon"); }

    window.onload = () => {
      initFirebase();
      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          initializeApp();
        } else {
          document.getElementById('auth-modal').classList.remove('hidden');
        }
      });
    };

    // Expose
    Object.assign(window, {
      googleSignIn, guestSignIn, sendMessage, handleKeydown, triggerFileUpload,
      startVoiceCall, startVideoCall, toggleMute, endCall, showProfileModal,
      closeProfileModal, logout, navigateToHome, switchToHomeView, showSearchModal,
      toggleMembersSidebar, showEmojiModal, createNewServer
    });
  </script>
</body>
</html>
